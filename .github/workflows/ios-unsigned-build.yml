name: iOS unsigned build (for Sideloadly)

# Manual trigger only — this consumes macOS runner minutes, so we don't
# want it firing on every push. Go to the Actions tab on GitHub and click
# "Run workflow" whenever you want a fresh .ipa to sideload.
on:
  workflow_dispatch: {}

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild -p ios --no-install
        env:
          CI: 1

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Detect Xcode workspace and scheme
        id: xcode-config
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          # Don't parse `xcodebuild -list` for the scheme — the workspace can
          # expose several shared schemes (Pods sub-targets, etc.) and picking
          # the first one silently built a Pod instead of the app. The app's
          # own .xcodeproj lives directly under ios/ (CocoaPods' Pods.xcodeproj
          # is nested inside ios/Pods/, so this glob can only match the app
          # project), and Expo/Xcode name the scheme identically to it.
          PROJECT_NAME=$(basename "$(ls -d *.xcodeproj | head -n1)" .xcodeproj)
          echo "Detected workspace: $WORKSPACE"
          echo "Detected scheme (from .xcodeproj name): $PROJECT_NAME"
          echo "----- all schemes xcodebuild can see, for reference -----"
          xcodebuild -list -workspace "$WORKSPACE" || true
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      # Code signing is fully disabled on purpose: this produces an
      # unsigned, device-architecture (arm64) build. Sideloadly re-signs it
      # afterwards on your Windows PC using a free Apple ID, which is the
      # whole point of this pipeline (no Apple Developer Program, no Mac
      # of your own required).
      - name: Build unsigned .app for a real device
        working-directory: ios
        run: |
          echo "Using workspace='${{ steps.xcode-config.outputs.workspace }}' scheme='${{ steps.xcode-config.outputs.scheme }}'"
          set +e
          xcodebuild \
            -workspace "${{ steps.xcode-config.outputs.workspace }}" \
            -scheme "${{ steps.xcode-config.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build 2>&1 | tee ../xcodebuild.log
          XCODE_EXIT=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $XCODE_EXIT"
          echo "----- last 40 lines of xcodebuild output -----"
          tail -n 40 ../xcodebuild.log
          if [ "$XCODE_EXIT" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" ../xcodebuild.log; then
            echo "::error::xcodebuild did not report BUILD SUCCEEDED (exit code $XCODE_EXIT) — see the full log in the uploaded xcodebuild-log artifact."
            exit 1
          fi

      # Always runs, even if the build/packaging steps above failed — small
      # and targeted so it never gets truncated when pasted into chat.
      - name: Debug — inspect build output layout
        if: always()
        working-directory: ios
        run: |
          echo "----- ios/build (top level) -----"
          ls -la build 2>/dev/null || echo "(build/ does not exist)"
          echo "----- ios/build/Build (top level) -----"
          ls -la build/Build 2>/dev/null || echo "(build/Build does not exist)"
          echo "----- ios/build/Build/Products (up to 3 levels) -----"
          find build/Build/Products -maxdepth 3 2>/dev/null || echo "(build/Build/Products does not exist)"
          echo "----- any *.app anywhere under ios/build -----"
          find build -type d -iname "*.app" 2>/dev/null || echo "(none found)"

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 14

      - name: Package as .ipa
        working-directory: ios
        run: |
          # Search the whole derived-data tree (not just the expected
          # Products/<Config>-iphoneos path) and match case-insensitively —
          # more resilient to Xcode/RN layout differences across versions.
          APP_PATH=$(find build -type d -iname "*.app" 2>/dev/null | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Nothing under ios/build — falling back to a full search of ios/ (excluding Pods/)"
            APP_PATH=$(find . -type d -iname "*.app" -not -path "*/Pods/*" 2>/dev/null | head -n1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find any .app bundle under ios/ — check the 'Debug — inspect build output layout' step above and the xcodebuild-log artifact."
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ../TodoQuest-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoQuest-unsigned-ipa
          path: TodoQuest-unsigned.ipa
          retention-days: 14
