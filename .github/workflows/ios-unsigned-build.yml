name: iOS unsigned build (for Sideloadly)

# Manual trigger only — this consumes macOS runner minutes, so we don't
# want it firing on every push. Go to the Actions tab on GitHub and click
# "Run workflow" whenever you want a fresh .ipa to sideload.
on:
  workflow_dispatch: {}

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild -p ios --no-install
        env:
          CI: 1

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Detect Xcode workspace and scheme
        id: xcode-config
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1; next} flag && NF{print $1; exit}')
          echo "Detected workspace: $WORKSPACE"
          echo "Detected scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # Code signing is fully disabled on purpose: this produces an
      # unsigned, device-architecture (arm64) build. Sideloadly re-signs it
      # afterwards on your Windows PC using a free Apple ID, which is the
      # whole point of this pipeline (no Apple Developer Program, no Mac
      # of your own required).
      - name: Build unsigned .app for a real device
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode-config.outputs.workspace }}" \
            -scheme "${{ steps.xcode-config.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package as .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find the built .app bundle under build/Build/Products"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ../TodoQuest-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoQuest-unsigned-ipa
          path: TodoQuest-unsigned.ipa
          retention-days: 14
